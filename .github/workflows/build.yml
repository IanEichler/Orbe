name: Compilar e publicar Orbe

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: orbe-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build app folder (for the installer)
        run: pyinstaller Orbe.spec --noconfirm

      - name: Build portable Orbe.exe
        run: pyinstaller Orbe.spec --noconfirm
        env:
          ONEFILE: "1"

      - name: Smoke-test both builds
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          foreach ($exe in @("dist\Orbe\Orbe.exe", "dist\Orbe.exe")) {
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Self-test failed for $exe ($($p.ExitCode))" }
            "Self-test passed: $exe"
          }
          "{0:N1} MB portable" -f ((Get-Item dist\Orbe.exe).Length / 1MB)

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer\Orbe.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          "{0:N1} MB installer" -f ((Get-Item dist\Orbe-Setup.exe).Length / 1MB)

      - name: Test the installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $p = Start-Process dist\Orbe-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=contextmenu" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed ($($p.ExitCode))" }
          $app = "$env:LOCALAPPDATA\Programs\Orbe\Orbe.exe"
          if (-not (Test-Path $app)) { throw "App not installed" }
          if (-not (Test-Path "HKCU:\Software\Classes\*\shell\Orbe\command")) { throw "Context menu not registered" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $t = Start-Process $app -ArgumentList "--selftest" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "Installed app self-test failed" }
          Remove-Item Env:QT_QPA_PLATFORM
          $u = Start-Process "$env:LOCALAPPDATA\Programs\Orbe\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep 3
          if (Test-Path "HKCU:\Software\Classes\*\shell\Orbe") { throw "Uninstall left the context menu behind" }
          "Installer OK"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Orbe.exe
            dist/Orbe-Setup.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build Orbe.app
        run: pyinstaller Orbe.spec --noconfirm

      - name: Self-test the app bundle
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/Orbe.app/Contents/MacOS/Orbe --selftest
          codesign --verify --deep --verbose=2 dist/Orbe.app || true
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" dist/Orbe.app/Contents/Info.plist

      - name: Sign & notarize the app (only when Apple credentials are configured)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "No Apple Developer ID configured: shipping ad-hoc signed (users see Gatekeeper's warning)."
            exit 0
          fi
          KC=build.keychain; KCPW=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "$KCPW" $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p "$KCPW" $KC
          security import cert.p12 -k $KC -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" $KC
          # sign every nested binary first, then the bundle (hardened runtime + timestamp)
          find dist/Orbe.app/Contents -type f \( -name "*.so" -o -name "*.dylib" -o -perm -111 \) -print0 |
            xargs -0 -I{} codesign --force --timestamp --options runtime --entitlements installer/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" "{}" || true
          codesign --force --deep --timestamp --options runtime --entitlements installer/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" dist/Orbe.app
          codesign --verify --deep --strict --verbose=2 dist/Orbe.app
          ditto -c -k --keepParent dist/Orbe.app Orbe.zip
          xcrun notarytool submit Orbe.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple dist/Orbe.app
          spctl --assess --type execute --verbose dist/Orbe.app
          echo "SIGNED=1" >> $GITHUB_ENV

      - name: Make the .dmg (drag Orbe to Applications)
        run: |
          mkdir -p dmg
          cp -R dist/Orbe.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Orbe" -srcfolder dmg -ov -format UDZO "dist/Orbe-mac-${{ matrix.arch }}.dmg"
          du -h "dist/Orbe-mac-${{ matrix.arch }}.dmg"
          if [ "$SIGNED" = "1" ]; then
            codesign --force --timestamp --sign "${{ secrets.MACOS_SIGN_IDENTITY }}" "dist/Orbe-mac-${{ matrix.arch }}.dmg"
            xcrun notarytool submit "dist/Orbe-mac-${{ matrix.arch }}.dmg" --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --wait
            xcrun stapler staple "dist/Orbe-mac-${{ matrix.arch }}.dmg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/Orbe-mac-${{ matrix.arch }}.dmg

  linux:
    # Built on Debian 12 (glibc 2.36): the .deb runs on Debian 12/13, Ubuntu 23.04+, Mint 22, MX 23…
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: System packages
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            git ca-certificates python3 python3-venv python3-dev binutils dpkg-dev file \
            libx11-6 libxext6 libxrender1 libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libfreetype6 \
            libdbus-1-3 libegl1 libgl1 libglib2.0-0 \
            xvfb xfwm4 thunar xdotool dbus-x11 ffmpeg feh fonts-dejavu-core fonts-noto-core \
            desktop-file-utils hicolor-icon-theme xdg-utils

      - uses: actions/checkout@v4

      - name: Python environment
        run: |
          # Python 3.12 (portable build via uv): Debian 12's 3.11 hits a C-extension refcount bug
          # on None that is harmless on 3.12+ (None is immortal there)
          python3 -m venv /opt/uv && /opt/uv/bin/pip install -q uv
          /opt/uv/bin/uv python install 3.12
          /opt/uv/bin/uv venv -p 3.12 /opt/venv
          VIRTUAL_ENV=/opt/venv /opt/uv/bin/uv pip install -q -r requirements.txt pyinstaller pytest
          /opt/venv/bin/python --version

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: /opt/venv/bin/python -m pytest -q

      - name: Build the app folder
        run: /opt/venv/bin/pyinstaller Orbe.spec --noconfirm

      - name: Build the .deb
        run: |
          PATH=/opt/venv/bin:$PATH packaging/linux/build-deb.sh 2.0.0
          dpkg-deb --info dist/Orbe-linux-amd64.deb
          desktop-file-validate packaging/linux/orbe.desktop

      - name: Install the .deb and self-test it
        env:
          QT_QPA_PLATFORM: offscreen
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          mkdir -p e2e_linux_out
          apt-get install -y -q ./dist/Orbe-linux-amd64.deb 2>&1 | tail -5
          test -x /usr/bin/orbe
          set +e
          orbe --selftest > e2e_linux_out/selftest.txt 2>&1
          rc=$?
          set -e
          echo "exit code $rc" >> e2e_linux_out/selftest.txt
          cat ~/.local/share/Orbe/log.txt >> e2e_linux_out/selftest.txt 2>/dev/null || true
          if [ $rc -ne 0 ]; then
            /opt/venv/bin/python -X faulthandler -m orbe --selftest >> e2e_linux_out/selftest.txt 2>&1 || true
            cat ~/.local/share/Orbe/log.txt >> e2e_linux_out/selftest.txt 2>/dev/null || true
          fi
          cat e2e_linux_out/selftest.txt
          if [ $rc -ne 0 ]; then
            tail -25 e2e_linux_out/selftest.txt | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=selftest::$l"; done
            exit $rc
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-deb
          path: dist/Orbe-linux-amd64.deb

  publish:
    needs: [windows, macos, linux]
    if: github.event_name == 'push' && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - run: ls -la out

      - name: Publish download (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Orbe (latest build)
          make_latest: true
          body: |
            **Orbe — Edição Estúdio**

            **Windows:** use **Orbe-Setup.exe** para instalar, ou **Orbe.exe** para executar a versão portátil.
            A instalação abre apenas a confirmação compacta. Nas próximas inicializações o aplicativo fica na bandeja.

            **macOS:** baixe o DMG da sua arquitetura e arraste o Orbe para Aplicativos.
            Instalação pelo terminal:
            `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install-mac.sh | ORBE_REPOSITORY=${{ github.repository }} bash`

            **Linux:** instale **Orbe-linux-amd64.deb** em uma distribuição compatível com Debian 12 ou mais recente.
            O atalho global requer uma sessão X11.

            Para usar, arraste um arquivo, pressione **Shift** e solte em uma opção do menu circular.
            Pressione **Shift** novamente para alternar entre Converter e Ferramentas.

            Compilado a partir do commit ${{ github.sha }}.
          files: out/*

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
